<!DOCTYPE html>
<html lang="vi" class="geo-guest-locked">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Geography Edu - Nền tảng lưu trữ tài liệu, chia sẻ kiến thức Địa lý và bài viết dự án High School Help Kit & Group Địa Lí.">
  <meta name="theme-color" content="#0d9488">
  <title>Geography Edu - High School Help Kit | Lưu trữ & Chia sẻ Tài liệu Địa lý</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- External Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Leaflet CSS for Globe Detail Map -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta property="og:image" content="assets/logo.png">
  <meta name="twitter:image" content="assets/logo.png">

  <!-- Content Security Policy (CSP) & Browser Protection for High-Level XSS & Injection Defense -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://*.firebaseio.com https://apis.google.com https://accounts.google.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://*.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data: https: blob: https://*.googleusercontent.com https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.google.com wss://*.firebaseio.com https://api.groq.com https://generativelanguage.googleapis.com https://cdn.jsdelivr.net https://*.openstreetmap.org https://flagcdn.com https://*.tile.openstreetmap.org https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src 'self' https://docs.google.com https://drive.google.com https://*.firebaseapp.com https://accounts.google.com https://apis.google.com;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- Instant Auth Gate Check to prevent any content flash on page access -->
  <script>
    (function () {
      try {
        var session = sessionStorage.getItem("geo_edu_current_user") || localStorage.getItem("geo_edu_current_user");
        if (session && session !== "null" && session !== "undefined" && session.trim() !== "") {
          document.documentElement.classList.remove("geo-guest-locked");
          document.documentElement.classList.add("geo-logged-in");
        } else {
          document.documentElement.classList.remove("geo-logged-in");
          document.documentElement.classList.add("geo-guest-locked");
        }
      } catch (e) {
        document.documentElement.classList.remove("geo-logged-in");
        document.documentElement.classList.add("geo-guest-locked");
      }
    })();
  </script>
</head>

<body>

  <!-- Network Status Offline/Online Banner -->
  <div id="network-status-banner" class="network-status-banner" style="display: none;">
    <div class="network-banner-content">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
      <span id="network-status-text">Bạn đang ở chế độ ngoại tuyến (Offline). Dữ liệu đã lưu sẽ tự động đồng bộ khi có
        kết nối trở lại.</span>
    </div>
  </div>

  <!-- Super Admin User Impersonation Top Banner -->
  <div id="impersonation-banner" class="impersonation-banner" style="display: none;">
    <div class="impersonation-banner-content">
      <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Đang truy cập với tư cách: <strong id="impersonated-user-name" style="color: #fef08a;">...</strong> (<code id="impersonated-user-email" style="background: rgba(0,0,0,0.25); color: #fff; padding: 2px 6px; border-radius: 4px;">...</code>)</span>
      </div>
      <button class="btn btn-sm btn-warning" onclick="handleExitImpersonation()" style="font-weight: 700; padding: 4px 14px; font-size: 0.82rem; box-shadow: var(--shadow-sm); cursor: pointer;">
        Quay lại Admin Tổng
      </button>
    </div>
  </div>

  <!-- Mandatory Auth Gate Overlay (When user is not logged in) -->
